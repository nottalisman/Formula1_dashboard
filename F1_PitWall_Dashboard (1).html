<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitWall · F1 Dashboard</title>
<style>
:root{
  --accent:#E10600; --gold:#FFC400; --good:#2ECC71; --bad:#FF5A5A;
  --s1c:#E10600; --s2c:#2F9BFF; --s3c:#FFC400;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "DIN Alternate", "Bahnschrift", Arial, sans-serif;
  --radius:10px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#2A2A31; --panel:#1D1D23; --panel2:#24242B; --line:#3A3A45; --grid:#2F2F38;
  --text:#FFFFFF; --text2:#C9C9D3; --muted:#9A9AAA; --chip:#34343E; --chipText:#FFFFFF; --hover:#2A2A33;
  --trk-base:#3A3A44; --trk-edge:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.45);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
  --grid-line:#8E8E9E;
}
:root[data-theme="light"]{
  color-scheme:light;
  --canvas:#E6E6EC; --panel:#FFFFFF; --panel2:#F5F5F8; --line:#D8D8E0; --grid:#ECECF1;
  --text:#15151E; --text2:#3F3F4D; --muted:#6B6B7C; --chip:#15151E; --chipText:#FFFFFF; --hover:#F1F1F5;
  --trk-base:#D9D9E1; --trk-edge:#15151E; --shadow:0 10px 30px rgba(20,20,40,.18);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --grid-line:#8A8A99;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{transition:background-color .35s ease,color .35s ease;min-height:100vh}
button,select{font:inherit;color:inherit}
.wrap{max-width:1560px;margin:0 auto;padding:0 18px 18px}

/* ---------- header */
.top{display:flex;align-items:center;gap:18px;padding:12px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;flex:none;padding-right:18px;border-right:1px solid var(--line)}
.brand .mark{display:flex;gap:3px}
.brand .mark i{display:block;width:6px;height:26px;background:var(--accent);transform:skewX(-18deg)}
.brand .mark i:nth-child(2){opacity:.72}.brand .mark i:nth-child(3){opacity:.45}
.brand b{font:800 21px/1 var(--display);letter-spacing:1.5px}.brand b span{color:var(--accent)}
.brand small{display:block;font-size:8px;letter-spacing:2.4px;color:var(--muted);font-weight:700;margin-top:3px}
.titles{flex:1;min-width:0}
.titles h1{margin:0;font:700 19px/1.2 var(--display);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titles p{margin:3px 0 0;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;flex:none}
.tab{background:none;border:0;padding:10px 12px 12px;font-size:11.5px;font-weight:700;letter-spacing:1.1px;color:var(--muted);cursor:pointer;position:relative}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px;background:var(--accent)}
.toggle{flex:none;background:var(--chip);color:var(--chipText);border:0;border-radius:8px;padding:8px 12px;font-size:11.5px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:background .2s}
.toggle:hover{background:var(--accent)}

/* ---------- filter row */
.filters{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 0 12px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl label{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--muted)}
.ctl select{appearance:none;-webkit-appearance:none;background:var(--chip) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0h10L5 6z' fill='%23fff'/></svg>") no-repeat right 10px center;color:var(--chipText);border:1px solid var(--line);border-radius:7px;padding:7px 30px 7px 11px;font-size:13px;font-weight:600;cursor:pointer;max-width:260px}
.ctl select:focus-visible,.tab:focus-visible,.toggle:focus-visible,.seg button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{margin-left:auto;font-size:11px;color:var(--muted)}
.chipbtn{background:var(--chip);color:var(--chipText);border:0;border-radius:7px;padding:7px 12px;font-size:11.5px;font-weight:700;letter-spacing:1px;cursor:pointer}
.chipbtn:hover{background:var(--accent)}
.clear{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:7px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.clear:hover{color:var(--text);border-color:var(--muted)}

/* ---------- grid + cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.card{background:var(--panel);border:1px solid color-mix(in srgb,var(--line) 60%,transparent);border-radius:var(--radius);padding:14px 16px;min-width:0;position:relative;transition:background-color .35s}
.card h2{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:1.5px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.card h2::before{content:"";width:3px;height:14px;background:var(--accent);margin-left:-16px;margin-right:3px;border-radius:0 2px 2px 0}
.card h2 .sub{margin-left:auto;font-size:10.5px;font-weight:600;letter-spacing:.2px;color:var(--muted);text-transform:none}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:1100px){.top{flex-wrap:wrap}.titles{order:5;flex-basis:100%}}
@media (max-width:1180px){.c2{grid-column:span 4}.c3,.c4,.c5,.c7,.c8,.c9{grid-column:span 6}.c6{grid-column:span 12}}
@media (max-width:760px){.grid>*{grid-column:1/-1!important}.tabs{order:3;width:100%}.top{flex-wrap:wrap}.hint{display:none}}

.lbl{font-size:9.5px;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.big{font:700 28px/1.1 var(--display);letter-spacing:-.3px}
.mid{font:700 20px/1.15 var(--display)}
.muted{color:var(--muted)}.t2{color:var(--text2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.tile{background:var(--panel2);border-radius:8px;padding:10px 12px;position:relative;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:10px;width:2px;height:16px;background:var(--accent)}
.tile .v{font:700 15px/1.25 var(--display);margin-top:6px}
.kpitile{background:var(--panel);border-radius:var(--radius);padding:14px 16px;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);position:relative;min-width:0}
.kpitile::before{content:"";position:absolute;left:0;top:16px;width:3px;height:14px;background:var(--accent);border-radius:0 2px 2px 0}
.kpitile .big{margin:6px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpitile .big.txt{font-size:clamp(17px,1.45vw,24px);line-height:34px}
.kpitile .s{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;font-size:9.5px;letter-spacing:1.3px;color:var(--muted);font-weight:800;padding:6px 6px;border-bottom:1px solid var(--line);z-index:1;text-transform:uppercase}
.tbl td{padding:5px 6px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.row{cursor:pointer;transition:background .15s}
.tbl tr.row:hover,.tbl tr.row:focus-visible{background:var(--hover)}
.tbl .num{text-align:center}.tbl td.gpn{max-width:100px;overflow:hidden;text-overflow:ellipsis}.tbl .r{text-align:right}
.scroll{overflow:auto;max-height:560px;border-radius:6px}
.teamchip{display:inline-block;width:4px;height:16px;border-radius:2px;vertical-align:-3px;margin-right:8px}
.flag{font-size:18px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pos{font:700 14px var(--display)}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.status-next td{color:var(--accent)!important}
.status-up td{color:var(--muted)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-weight:600}
.empty b{display:block;color:var(--text);font:700 22px var(--display);margin:6px 0}

/* ---------- misc widgets */
.seg{display:inline-flex;background:var(--panel2);border-radius:7px;padding:2px;margin-left:auto}
.seg button{border:0;background:none;padding:4px 9px;border-radius:5px;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--chipText)}
.spot{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.spot .nm1{font-size:14px;color:var(--text2);font-weight:600}
.spot .nm2{font:800 30px/1 var(--display);letter-spacing:.5px}
.spot .team{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;display:flex;align-items:center;gap:6px}
.spot .p{color:var(--accent);font-weight:800;font-size:12.5px;margin-top:6px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.track svg{display:block;width:100%;height:auto;max-height:330px}
.trk-base{stroke:var(--trk-base)}.trk-edge{stroke:var(--trk-edge)}
.chart{position:relative}
.chart svg{display:block;overflow:visible}
.axis text,.ax{fill:var(--muted);font-size:10.5px;font-weight:600;font-family:var(--font)}
.gl{stroke:var(--grid);stroke-width:1}
.lab{fill:var(--text);font-size:11.5px;font-weight:700;font-family:var(--font);font-variant-numeric:tabular-nums}
.name{fill:var(--text2);font-size:12px;font-weight:600;font-family:var(--font)}
.hit{fill:transparent;cursor:pointer}
g.bar:hover path,g.bar:focus path{filter:brightness(1.18)}
g.bar:hover .name{fill:var(--text)}
.dim{opacity:.28}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text2);font-weight:600;margin:0 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend i.sq{width:10px;height:10px;border-radius:2px}
.donutwrap{display:flex;align-items:center;gap:14px}
.donutwrap .legend{flex-direction:column;gap:7px;margin:0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.h2h{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.bigav{width:132px;height:132px;flex:none}
.identity{display:flex;gap:18px;align-items:center}
.foot{margin-top:14px;font-size:10.5px;color:var(--muted);text-align:right}
.foot a{color:var(--muted)}

/* ---------- tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;min-width:170px;max-width:300px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}
#tip .tt-h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#tip .tt-n{font-weight:800;font-size:13.5px}
#tip .tt-s{color:var(--muted);font-weight:600;font-size:11.5px}
#tip .tt-g{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;border-top:1px solid var(--line);padding-top:8px}
#tip .tt-v{font:700 16px var(--display)}
#tip .tt-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-weight:600;color:var(--text2)}
#tip .tt-row b{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;padding-left:12px}
#tip .tt-row i{display:inline-block;width:12px;height:3px;border-radius:2px}

/* ---------- motion */
@keyframes growx{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@keyframes pop{from{opacity:0;transform:scale(.92)}}
.gx{transform-box:fill-box;transform-origin:left center;animation:growx .7s cubic-bezier(.2,.8,.2,1) both}
.gy{transform-box:fill-box;transform-origin:center bottom;animation:growy .6s cubic-bezier(.2,.8,.2,1) both}
.dl{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s ease-out forwards}
.fade{animation:fade .45s ease both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s ease both}
.static *,.static{animation:none!important;stroke-dashoffset:0!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dl{stroke-dashoffset:0}}
</style>
</head>

<script>
"use strict";
/* ======================================================= data */
const D = JSON.parse(document.getElementById("data").textContent);
const drivers = D.drivers.map(a => ({id:a[0],name:a[1],first:a[2],last:a[3],code:a[4],perm:a[5],nat:a[6],cc:a[7],dob:a[8],
  cStarts:a[9],cWins:a[10],cPod:a[11],cPoles:a[12],titles:a[13],cPts:a[14],photo:a[15]}));
const teams = D.teams.map(a => ({id:a[0],name:a[1],color:a[2],full:a[3],pu:a[4]}));
const races = D.races.map(a => ({id:a[0],year:a[1],round:a[2],gp:a[3],gpShort:a[4],official:a[5],date:a[6],time:a[7],cid:a[8],
  circuit:a[9],place:a[10],country:a[11],cc:a[12],type:a[13],dir:a[14],laps:a[15],len:a[16],dist:a[17],turns:a[18],sprint:a[19],
  status:a[20],first:a[21],held:a[22],blurb:a[23],code:a[24],gcc:a[25]}));
const results = D.results.map(a => ({race:a[0],sprint:a[1],d:a[2],t:a[3],num:a[4],pos:a[5],posText:a[6],order:a[7],grid:a[8],
  gained:a[9],pts:a[10],time:a[11],gap:a[12],status:a[13],reason:a[14],cls:a[15],pole:a[16],fl:a[17],dotd:a[18],quali:a[19],
  mate:a[20],rw:a[21],rl:a[22],qw:a[23],ql:a[24]}));
const sessions = D.sessions.map(a => ({race:a[0],order:a[1],name:a[2],start:a[3],dur:a[4],known:a[5]}));
const dstand = D.dstand.map(a => ({race:a[0],d:a[1],pos:a[2],pts:a[3]}));
const raceById = new Map(races.map(r => [r.id, r]));
const seasons = [...new Set(races.map(r => r.year))].sort((a,b) => b-a);
const driverIdx = new Map(drivers.map((d,i) => [d.id,i]));

/* ======================================================= state */
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };
const S = { page:"race", theme: store.get("pw-theme") || "dark", season: seasons[0], raceId: null,
            team: "", driver: "", profile: null, tz: store.get("pw-tz") || "local" };

/* ======================================================= helpers */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v => v == null ? "—" : (Math.round(v*10)/10).toLocaleString("en-US");
const flag = cc => cc && cc.length === 2 ? `<span class="flag" title="${esc(cc)}">${String.fromCodePoint(...[...cc.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65))}</span>` : "";
const seasonRaces = y => races.filter(r => r.year === y).sort((a,b) => a.round - b.round);
const inSeason = (y) => { const ids = new Set(seasonRaces(y).map(r => r.id)); return results.filter(x => ids.has(x.race)); };
const tz = () => S.tz === "utc" ? "UTC" : undefined;
const tzName = () => S.tz === "utc" ? "UTC" : (new Intl.DateTimeFormat("en", {timeZoneName:"short"}).formatToParts(new Date()).find(p => p.type === "timeZoneName") || {}).value || "local";
const utc = s => new Date(s.replace(" ", "T") + (s.length <= 10 ? "T00:00:00Z" : "Z"));
const dfmt = (d, o) => new Intl.DateTimeFormat("en-GB", {...o, timeZone: tz()}).format(d);
const raceStart = r => utc(r.date + " " + (r.time || "12:00") + ":00");

function helmet(color, num, size) {
  const c = color || "#8E8E9E";
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="${c}"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <path d="M12 39C12 22 25 12 40 13C51 14 57 22 57 32L57 39Q57 45 51 45L18 45Q12 45 12 39Z" fill="#fff"/>
  <path d="M33 23L57 25.5L57 33L36 33Q31.5 33 31.5 28.5Z" fill="#15151E"/>
  <rect x="12" y="40" width="45" height="5" rx="2.5" fill="${c}" fill-opacity=".55"/>
  <text x="22" y="38.5" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="${c}">${num ?? ""}</text></svg>`;
}
function avatar(dr, color, num, size) {
  if (dr && dr.photo) return `<img src="${esc(dr.photo)}" width="${size}" height="${size}" style="border-radius:50%;object-fit:cover;background:${color}" alt="">`;
  return helmet(color, num, size);
}
const car = (color, w = 92) => `<svg width="${w}" height="${w*56/200}" viewBox="0 0 200 56" aria-hidden="true">
  <path d="M6 12L22 12L22 30L14 30L6 22Z" fill="${color}"/><rect x="4" y="9" width="22" height="4" rx="1" fill="#15151E"/>
  <path d="M20 34L34 24L70 21L92 12L104 12L112 20L150 25L186 33L194 38L194 41L20 41Z" fill="${color}"/>
  <path d="M92 12Q102 4 114 12L112 16Q102 10 94 15Z" fill="#15151E"/><path d="M70 30L150 30L150 33L70 33Z" fill="#fff" fill-opacity=".35"/>
  <path d="M160 41L198 41L198 46L158 46Z" fill="#15151E"/><circle cx="42" cy="40" r="13" fill="#15151E"/><circle cx="42" cy="40" r="6" fill="#6B6B78"/>
  <circle cx="160" cy="41" r="11" fill="#15151E"/><circle cx="160" cy="41" r="5" fill="#6B6B78"/></svg>`;
const hbar = (x, y, w, h, r = 4) => w <= 0 ? "" : w < r ? `M${x} ${y}h${w}v${h}h${-w}Z` :
  `M${x} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x}Z`;
const vbar = (x, base, w, h, r = 4) => h <= 0 ? "" : h < r ? `M${x} ${base}v${-h}h${w}v${h}Z` :
  `M${x} ${base}V${base-h+r}Q${x} ${base-h} ${x+r} ${base-h}H${x+w-r}Q${x+w} ${base-h} ${x+w} ${base-h+r}V${base}Z`;
const niceStep = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; };
const niceScale = (max, n = 4) => { const step = niceStep(Math.max(max, 1) / n); const hi = Math.ceil(Math.max(max, 1) / step) * step;
  const ticks = []; for (let v = 0; v <= hi + 1e-9; v += step) ticks.push(v); return {hi, ticks}; };
const title = s => s ? s.toLowerCase().replace(/(^|[\s-])(\S)/g, (m, a, b) => a + b.toUpperCase()) : s;

/* ---- season aggregates */
function standingsRace(y, maxRound = 99) {
  const ids = new Set(seasonRaces(y).filter(r => r.round <= maxRound).map(r => r.id));
  let best = null;
  for (const s of dstand) if (ids.has(s.race) && (best == null || raceById.get(s.race).round > raceById.get(best).round)) best = s.race;
  return best;
}
const standingsAt = rid => dstand.filter(s => s.race === rid).sort((a,b) => a.pos - b.pos);
function lastTeam(rows, d) {           // latest race row for driver -> team & number
  let best = null;
  for (const x of rows) if (x.d === d && !x.sprint && (!best || raceById.get(x.race).round > raceById.get(best.race).round)) best = x;
  return best;
}
function driverSeason(y, d, maxRound = 99) {
  const rows = inSeason(y).filter(x => x.d === d && raceById.get(x.race).round <= maxRound);
  const gp = rows.filter(x => !x.sprint);
  const fin = gp.filter(x => x.pos != null), grid = gp.filter(x => x.grid > 0);
  const lt = lastTeam(rows, d);
  return { rows, gp, pts: rows.reduce((a,x) => a + (x.pts||0), 0), wins: gp.filter(x => x.pos === 1).length,
    pod: gp.filter(x => x.pos && x.pos <= 3).length, poles: gp.filter(x => x.pole).length,
    dnf: gp.filter(x => ["DNF","DSQ","NC"].includes(x.status)).length, starts: gp.filter(x => x.status !== "DNS").length,
    avgFin: fin.length ? fin.reduce((a,x) => a + x.pos, 0) / fin.length : null,
    avgGrid: grid.length ? grid.reduce((a,x) => a + x.grid, 0) / grid.length : null,
    best: fin.length ? Math.min(...fin.map(x => x.pos)) : null,
    team: lt ? teams[lt.t] : null, num: lt ? lt.num : null,
    rw: gp.reduce((a,x) => a + (x.rw||0), 0), rl: gp.reduce((a,x) => a + (x.rl||0), 0),
    qw: gp.reduce((a,x) => a + (x.qw||0), 0), ql: gp.reduce((a,x) => a + (x.ql||0), 0) };
}
function effectiveRace() {
  const list = seasonRaces(S.season);
  const picked = S.raceId && raceById.get(S.raceId);
  if (picked && picked.year === S.season) return picked;
  const done = list.filter(r => r.status === "Completed");
  return done.length ? done[done.length - 1] : list[0];
}

/* ======================================================= tooltip */
const tip = document.getElementById("tip");
const TIPS = [];
function reg(fn) { TIPS.push(fn); return TIPS.length - 1; }
function showTip(html, x, y) {
  tip.innerHTML = html; tip.classList.add("on");
  const r = tip.getBoundingClientRect();
  let left = x + 16, top = y + 14;
  if (left + r.width > innerWidth - 8) left = x - r.width - 16;
  if (top + r.height > innerHeight - 8) top = y - r.height - 14;
  tip.style.left = Math.max(8, left) + "px"; tip.style.top = Math.max(8, top) + "px";
}
function hideTip() { tip.classList.remove("on"); }
function driverTip(d, y, extra = "") {
  const dr = drivers[d], s = driverSeason(y, d), col = s.team ? s.team.color : "#888";
  const sr = standingsRace(y), st = sr ? standingsAt(sr).find(z => z.d === d) : null;
  return `<div class="tt-h">${avatar(dr, col, s.num, 46)}<div><div class="tt-n">${esc(dr.name)} ${flag(dr.cc)}</div>
    <div class="tt-s">${esc(s.team ? s.team.name : "")}${st ? " · P" + st.pos + " in " + y : ""}</div></div></div>${extra}
    <div class="tt-g"><div><div class="lbl">Points</div><div class="tt-v">${fmt(s.pts)}</div></div>
    <div><div class="lbl">Wins</div><div class="tt-v">${s.wins}</div></div>
    <div><div class="lbl">Podiums</div><div class="tt-v">${s.pod}</div></div>
    <div><div class="lbl">Avg finish</div><div class="tt-v">${s.avgFin ? s.avgFin.toFixed(1) : "—"}</div></div></div>
    <div class="tt-s" style="margin-top:8px">Click to open profile</div>`;
}
document.addEventListener("pointermove", e => {
  const el = e.target.closest("[data-tip]");
  if (el) { showTip(TIPS[+el.dataset.tip](e), e.clientX, e.clientY); return; }
  const cross = e.target.closest("[data-cross]");
  if (cross) { CROSS[cross.dataset.cross](e, cross); return; }
  hideTip(); document.querySelectorAll(".xh").forEach(n => n.setAttribute("opacity", 0));
});
document.addEventListener("focusin", e => {
  const el = e.target.closest("[data-tip]");
  if (el) { const r = el.getBoundingClientRect(); showTip(TIPS[+el.dataset.tip]({}), r.right, r.top); }
});
document.addEventListener("focusout", hideTip);
const CROSS = {};

/* ======================================================= charts */
function barChart(id, rows, opts) {  // rows: {label, value, color, key, tip, click}
  const W = Math.max(280, document.getElementById(id)?.clientWidth || 400);
  const rowH = opts.rowH || 24, bh = Math.min(16, rowH - 8), labW = opts.labW || 130, right = 44;
  const H = rows.length * rowH + 4, max = Math.max(1, ...rows.map(r => r.value));
  let g = "";
  rows.forEach((r, i) => {
    const y = i * rowH, w = (W - labW - right) * r.value / max;
    const t = reg(r.tip);
    g += `<g class="bar${r.dim ? " dim" : ""}" data-tip="${t}" tabindex="0" data-act="${r.click || ""}" role="button" aria-label="${esc(r.label)} ${fmt(r.value)}">
      <rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}"/>
      <text class="name" x="${labW - 10}" y="${y + rowH/2 + 4}" text-anchor="end">${esc(r.label)}</text>
      <path class="gx" style="animation-delay:${i*22}ms" d="${hbar(labW, y + (rowH-bh)/2, Math.max(w, r.value > 0 ? 2 : 0), bh)}" fill="${r.color}"/>
      <text class="lab" x="${labW + w + 7}" y="${y + rowH/2 + 4}">${fmt(r.value)}</text></g>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(opts.aria)}">${g}</svg>`;
}

function lineChart(id, series, xs, opts) { // series: {name, color, pts:Map(x->y)}
  const W = Math.max(300, document.getElementById(id)?.clientWidth || 500), H = opts.h || 230;
  const L = 36, R = 16, T = 10, B = 24, iw = W - L - R, ih = H - T - B;
  const vals = series.flatMap(s => [...s.pts.values()]).filter(v => v != null);
  const inv = !!opts.invert;
  const sc = niceScale(Math.max(1, ...vals));
  const lo = inv ? 1 : 0, hi = inv ? Math.max(20, ...vals) : sc.hi;
  const X = x => L + (xs.length > 1 ? iw * xs.indexOf(x) / (xs.length - 1) : iw / 2);
  const Y = v => inv ? T + ih * (v - lo) / (hi - lo) : T + ih - ih * v / hi;
  const ticks = inv ? [1, 5, 10, 15, 20].filter(v => v <= hi) : sc.ticks;
  let g = ticks.map(v => `<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${L-8}" y="${Y(v)+4}" text-anchor="end">${inv ? "P" + v : Math.round(v)}</text>`).join("");
  const step = Math.ceil(xs.length / Math.max(1, Math.floor(iw / 34)));
  g += xs.map((x, i) => i % step === 0 || i === xs.length - 1 ? `<text class="ax" x="${X(x)}" y="${H-6}" text-anchor="middle">${esc(opts.xl ? opts.xl(x) : x)}</text>` : "").join("");
  series.forEach((s, si) => {
    const p = xs.filter(x => s.pts.get(x) != null).map(x => `${X(x).toFixed(1)},${Y(s.pts.get(x)).toFixed(1)}`);
    if (!p.length) return;
    g += `<polyline class="dl" pathLength="1" style="animation-delay:${si*90}ms" points="${p.join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const lastX = xs.filter(x => s.pts.get(x) != null).pop();
    g += `<circle class="pop" style="animation-delay:${900 + si*90}ms" cx="${X(lastX)}" cy="${Y(s.pts.get(lastX))}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
  });
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="var(--muted)" stroke-width="1" opacity="0"/>`;
  g += `<g class="xh-dots"></g>`;
  g += `<rect data-cross="${id}" x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent"/>`;
  CROSS[id] = (e, rect) => {
    const svg = rect.ownerSVGElement, bb = svg.getBoundingClientRect();
    const mx = e.clientX - bb.left;
    let best = xs[0], bd = 1e9;
    for (const x of xs) { const dd = Math.abs(X(x) - mx); if (dd < bd) { bd = dd; best = x; } }
    const ln = svg.querySelector(".xh"); ln.setAttribute("x1", X(best)); ln.setAttribute("x2", X(best)); ln.setAttribute("opacity", .6);
    const rows = series.map(s => ({s, v: s.pts.get(best)})).filter(o => o.v != null).sort((a,b) => inv ? a.v - b.v : b.v - a.v);
    svg.querySelector(".xh-dots").innerHTML = rows.map(o => `<circle cx="${X(best)}" cy="${Y(o.v)}" r="4" fill="${o.s.color}" stroke="var(--panel)" stroke-width="2"/>`).join("");
    showTip(`<div class="tt-s" style="margin-bottom:6px">${esc(opts.tipTitle(best))}</div>` +
      rows.map(o => `<div class="tt-row"><i style="background:${o.s.color}"></i>${esc(o.s.name)}<b>${inv ? "P" + o.v : fmt(o.v)}</b></div>`).join(""),
      e.clientX, e.clientY);
  };
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(opts.aria)}">${g}</svg>`;
}

function columnChart(id, cols, opts) { // cols: {x, value, color, tip}
  const W = Math.max(300, document.getElementById(id)?.clientWidth || 500), H = opts.h || 200;
  const L = 30, R = 6, T = 18, B = 22, iw = W - L - R, ih = H - T - B;
  const sc = niceScale(Math.max(1, ...cols.map(c => c.value)), 3), hi = sc.hi;
  const band = iw / Math.max(1, cols.length), bw = Math.min(24, band * .62);
  const Y = v => ih * v / hi;
  let g = sc.ticks.map(v => `<line class="gl" x1="${L}" x2="${W-R}" y1="${T+ih-Y(v)}" y2="${T+ih-Y(v)}"/><text class="ax" x="${L-6}" y="${T+ih-Y(v)+4}" text-anchor="end">${Math.round(v)}</text>`).join("");
  cols.forEach((c, i) => {
    const x = L + band * i + (band - bw) / 2, t = reg(c.tip);
    g += `<g class="bar" data-tip="${t}" tabindex="0" data-act="${c.click || ""}" role="button" aria-label="${esc(c.aria || c.x)}">
      <rect class="hit" x="${L + band*i}" y="${T}" width="${band}" height="${ih + B}"/>
      <path class="gy" style="animation-delay:${i*25}ms" d="${vbar(x, T+ih, bw, Math.max(Y(c.value), c.value > 0 ? 2 : 0))}" fill="${c.color}"/>
      ${c.value > 0 ? `<text class="lab" x="${x + bw/2}" y="${T+ih-Y(c.value)-5}" text-anchor="middle" style="font-size:10.5px">${fmt(c.value)}</text>` : ""}
      <text class="ax" x="${x + bw/2}" y="${H-6}" text-anchor="middle">${esc(c.x)}</text></g>`;
  });
  return `<svg width="${W}" height="${H}" role="img" aria-label="${esc(opts.aria)}">${g}</svg>`;
}

function donut(rows, size = 170) { // rows: {label, value, color}
  const tot = rows.reduce((a,r) => a + r.value, 0);
  if (!tot) return `<div class="empty">No wins yet</div>`;
  const R = size/2 - 4, r0 = R * .62, c = size/2;
  let a0 = -Math.PI/2, g = "";
  rows.forEach((r, i) => {
    const a1 = a0 + 2*Math.PI*r.value/tot, gap = rows.length > 1 ? .012 : 0;
    const s = a0 + gap, e = a1 - gap, large = e - s > Math.PI ? 1 : 0;
    const P = (a, rr) => `${(c + rr*Math.cos(a)).toFixed(2)} ${(c + rr*Math.sin(a)).toFixed(2)}`;
    const d = rows.length === 1 ? `M${c} ${c-R}A${R} ${R} 0 1 1 ${c-.01} ${c-R}L${c-.01} ${c-r0}A${r0} ${r0} 0 1 0 ${c} ${c-r0}Z`
      : `M${P(s,R)}A${R} ${R} 0 ${large} 1 ${P(e,R)}L${P(e,r0)}A${r0} ${r0} 0 ${large} 0 ${P(s,r0)}Z`;
    const t = reg(() => `<div class="tt-row"><i style="background:${r.color}"></i>${esc(r.label)}<b>${r.value} win${r.value>1?"s":""}</b></div><div class="tt-s">${Math.round(100*r.value/tot)}% of ${tot} races</div>`);
    g += `<path class="pop" data-tip="${t}" tabindex="0" style="animation-delay:${i*70}ms;cursor:pointer" data-act="team:${esc(r.key)}" d="${d}" fill="${r.color}"/>`;
    a0 = a1;
  });
  g += `<text x="${c}" y="${c-2}" text-anchor="middle" class="lab" style="font-size:26px;font-family:var(--display)">${tot}</text><text x="${c}" y="${c+16}" text-anchor="middle" class="ax">RACES WON</text>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Wins by team">${g}</svg>`;
}

function trackSVG(r) {
  const t = D.tracks[r.cid];
  if (!t) return `<div class="empty">Circuit map unavailable</div>`;
  const cols = ["var(--s1c)", "var(--s2c)", "var(--s3c)"];
  const [x0, y0, ang] = t.st;
  return `<svg viewBox="0 0 600 330" role="img" aria-label="Map of ${esc(r.circuit)}">
    <path d="${t.d}" fill="none" class="trk-base" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="${t.d}" fill="none" class="trk-edge" stroke-opacity=".9" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    ${t.s.map((d, i) => `<path class="dl" pathLength="1" style="animation-delay:${i*350}ms;animation-duration:.9s" d="${d}" fill="none" stroke="${cols[i]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`).join("")}
    ${t.l.map((p, i) => `<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="13" font-weight="800" fill="${cols[i]}" font-family="var(--font)">S${i+1}</text>`).join("")}
    <g transform="translate(${x0} ${y0}) rotate(${ang})"><rect x="-2" y="-11" width="5" height="22" class="trk-edge" fill="var(--trk-edge)"/>
      <path d="M12 -16 L24 -16 L24 -20 L32 -13 L24 -6 L24 -10 L12 -10 Z" fill="var(--accent)"/></g></svg>`;
}

/* ======================================================= controls */
function seasonSelect() {
  return `<div class="ctl"><label for="fSeason">SEASON</label><select id="fSeason">${seasons.map(y => `<option ${y === S.season ? "selected" : ""}>${y}</option>`).join("")}</select></div>`;
}

/* ======================================================= PAGE: race centre */
function pageRace() {
  const r = effectiveRace(), list = seasonRaces(S.season);

  const cls = results.filter(x => x.race === r.id && !x.sprint).sort((a,b) => a.order - b.order);

  setFilters(seasonSelect() + `<div class="ctl"><label for="fRace">RACE</label><select id="fRace">
      <option value="">Latest completed race</option>
      ${list.map(x => `<option value="${x.id}" ${S.raceId === x.id ? "selected" : ""}>R${String(x.round).padStart(2,"0")} · ${esc(x.gpShort)}${x.status !== "Completed" ? "  (upcoming)" : ""}</option>`).join("")}
    </select></div>
    <div class="hint">Click a driver to open their profile · hover rows and bars for details</div>`);

  // spotlight
  const winner = cls.find(x => x.pos === 1);
  const sr = standingsRace(S.season, r.round), st = sr ? standingsAt(sr) : [];
  const spotD = winner ? winner.d : (st[0] ? st[0].d : null);
  let spot = `<div class="empty">No results yet this season</div>`;
  if (spotD != null) {
    const s = driverSeason(S.season, spotD, r.round), dr = drivers[spotD], p = st.find(z => z.d === spotD);
    const col = winner ? teams[winner.t].color : (s.team ? s.team.color : "#888");
    spot = `<div class="spot fade"><div>${avatar(dr, col, winner ? winner.num : s.num, 104)}</div><div>
        <div class="nm1">${esc(dr.first)}</div><div class="nm2">${esc(dr.last)}</div>
        <div class="team"><span class="teamchip" style="background:${col}"></span>${esc(winner ? teams[winner.t].name : s.team?.name)} ${flag(dr.cc)}</div>
        ${p ? `<div class="p">P${p.pos} in championship${done ? "" : " (after R" + raceById.get(sr).round + ")"}</div>` : ""}</div></div>
      <div class="statrow"><div><div class="lbl">Points</div><div class="big" data-count="${s.pts}">${fmt(s.pts)}</div></div>
        <div><div class="lbl">Wins</div><div class="big" data-count="${s.wins}">${s.wins}</div></div>
        <div><div class="lbl">Podiums</div><div class="big" data-count="${s.pod}">${s.pod}</div></div></div>`;
  }

  // schedule
  const ss = sessions.filter(x => x.race === r.id).sort((a,b) => a.order - b.order);
  const sched = ss.map(x => { const t = utc(x.start), e = new Date(t.getTime() + x.dur*60000);
    return `<tr style="${x.name === "Race" ? "color:var(--accent)" : ""}"><td style="color:inherit">${esc(x.name)}</td><td>${dfmt(t,{weekday:"short"})}</td><td>${dfmt(t,{day:"numeric",month:"short"})}</td>
      <td class="r">${x.known ? dfmt(t,{hour:"2-digit",minute:"2-digit",hourCycle:"h23"}) + " – " + dfmt(e,{hour:"2-digit",minute:"2-digit",hourCycle:"h23"}) : "TBC"}</td></tr>`; }).join("");

  // classification
  const y = S.season;
  let table;
  if (cls.length) {
    table = `<div class="scroll"><table class="tbl"><thead><tr><th class="num">Pos</th><th></th><th>Driver</th><th class="num">Nat</th><th>Team</th><th>Car</th>
      <th class="num">Grid</th><th class="num">+/-</th><th>Time / gap</th><th class="num">Pts</th></tr></thead><tbody>` +
      cls.map((x, i) => { const dr = drivers[x.d], tm = teams[x.t];

        const t = reg(() => driverTip(x.d, y, `<div class="tt-s" style="margin:-2px 0 8px">This race: <b style="color:var(--text)">${esc(x.posText)}</b> from grid ${x.grid ?? "PL"} · ${fmt(x.pts)} pts</div>`));
        return `<tr class="row fade" style="animation-delay:${i*18}ms" tabindex="0" data-tip="${t}" data-act="driver:${x.d}">

  } else {
    table = `<div class="empty">Lights out in<b id="countdown" data-t="${raceStart(r).getTime()}"></b>${dfmt(raceStart(r),{weekday:"long",day:"numeric",month:"long",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})} (${esc(tzName())})</div>`;
  }

  // facts
  const byFlag = f => { const x = cls.find(z => z[f]); return x ? drivers[x.d].name : "—"; };
  const mover = cls.filter(x => x.gained != null).sort((a,b) => b.gained - a.gained || a.order - b.order)[0];
  const p2 = cls.find(x => x.pos === 2);
  const facts = [["Pole position", byFlag("pole")], ["Fastest lap", byFlag("fl")], ["Driver of the day", byFlag("dotd")],
    ["Biggest mover", mover && mover.gained > 0 ? `${drivers[mover.d].name}  +${mover.gained}` : "—"],
    ["Winning margin", p2 && p2.gap ? p2.gap + " s" : "—"],
    ["Finishers", cls.length ? `${cls.filter(x => x.cls).length} of ${cls.length} classified` : "—"]];

  document.getElementById("main").innerHTML = `<div class="grid"><div class="stack c6">

      <p class="t2" style="margin:0;line-height:1.55;font-size:13.5px;font-weight:500">${esc(r.blurb)}</p></section>
    <section class="card"><h2>Race facts</h2><div class="facts">${facts.map(f => `<div class="tile"><div class="lbl">${f[0]}</div><div class="v">${esc(f[1])}</div></div>`).join("")}</div></section>
    </div></div>
    <div class="stack c6">
      <div class="grid" style="grid-template-columns:1fr 1fr">
        <section class="card" style="grid-column:auto"><h2>Weekend schedule
          <span class="seg" role="group" aria-label="Time zone"><button data-act="tz:local" aria-pressed="${S.tz !== "utc"}">LOCAL</button><button data-act="tz:utc" aria-pressed="${S.tz === "utc"}">UTC</button></span></h2>
          <div class="muted" style="font-size:11.5px;font-weight:600;margin:-4px 0 6px">Times in ${esc(tzName())}${r.sprint ? " · Sprint weekend" : ""}</div>
          <table class="tbl"><thead><tr><th>Session</th><th>Day</th><th>Date</th><th class="r">Time</th></tr></thead><tbody>${sched}</tbody></table></section>
        <section class="card" style="grid-column:auto"><h2>${done ? "Race winner" : "Championship leader"}</h2>${spot}</section>
      </div>
      <section class="card"><h2>Race classification<span class="sub">gap to winner · +/- = places gained from grid</span></h2>${table.replace('class="scroll"', 'class="scroll" style="max-height:452px"')}</section>
    </div>
  </div>`;
}

/* ======================================================= PAGE: championship */
function pageChamp() {
  const y = S.season, list = seasonRaces(y), rows = inSeason(y);
  const done = list.filter(r => r.status === "Completed");
  const sr = standingsRace(y), st = sr ? standingsAt(sr) : [];
  const lastGP = done.length ? done[done.length-1] : null;
  document.getElementById("title").textContent = `${y}  FIA FORMULA ONE WORLD CHAMPIONSHIP`;
  document.getElementById("subtitle").textContent = !done.length ? `Season not started · ${list.length} rounds scheduled`
    : done.length === list.length ? `Final standings · ${list.length} rounds` : `Standings after Round ${lastGP.round} of ${list.length} · ${lastGP.gp}`;
  const seasonDrivers = [...new Set(rows.map(x => x.d))].sort((a,b) => drivers[a].last.localeCompare(drivers[b].last));
  const seasonTeams = [...new Set(rows.map(x => x.t))].sort((a,b) => teams[a].name.localeCompare(teams[b].name));
  setFilters(seasonSelect() +
    `<div class="ctl"><label for="fTeam">TEAM</label><select id="fTeam"><option value="">All teams</option>${seasonTeams.map(t => `<option value="${t}" ${String(t) === S.team ? "selected" : ""}>${esc(teams[t].name)}</option>`).join("")}</select></div>
     <div class="ctl"><label for="fDriver">DRIVER</label><select id="fDriver"><option value="">All drivers</option>${seasonDrivers.map(d => `<option value="${d}" ${String(d) === S.driver ? "selected" : ""}>${esc(drivers[d].name)}</option>`).join("")}</select></div>
     ${S.team || S.driver ? `<button class="clear" data-act="clear">Clear filters ✕</button>` : ""}
     <div class="hint">Click a team bar to filter · click a driver for their profile · click a race to open it</div>`);
  const fr = rows.filter(x => (S.team === "" || x.t === +S.team) && (S.driver === "" || x.d === +S.driver));

  // KPIs
  const p1 = st[0], p2 = st[1], next = list.find(r => r.status === "Next");
  const lead = p1 ? driverSeason(y, p1.d) : null;
  const winners = new Set(rows.filter(x => !x.sprint && x.pos === 1).map(x => x.d)).size;
  const grid = new Set(rows.filter(x => !x.sprint).map(x => x.d)).size;
  const kpi = (l, v, s, count) => `<div class="kpitile c2 fade"><div class="lbl">${l}</div><div class="big${count == null && String(v).length > 9 ? " txt" : ""}" ${count != null ? `data-count="${count}"` : ""} title="${esc(String(v).replace(/<[^>]+>/g, ""))}">${v}</div><div class="s">${s}</div></div>`;
  const kpis = kpi("Rounds completed", `${done.length} / ${list.length}`, "races run / scheduled") +
    kpi("Championship leader", p1 ? esc(drivers[p1.d].name) : "—", lead?.team ? esc(lead.team.name) : "") +
    kpi("Leader points", p1 ? fmt(p1.pts) : "—", p1 && p2 ? `+${fmt(p1.pts - p2.pts)} over ${esc(drivers[p2.d].last)}` : "", p1 ? p1.pts : null) +
    kpi("Different winners", winners, "Grand Prix winners", winners) +
    kpi("Next race", next ? esc(next.gpShort) : "Season complete", next ? `<span id="countdown" data-t="${raceStart(next).getTime()}"></span>` : "") +
    kpi("On the grid", grid, `drivers · ${new Set(rows.map(x => x.t)).size} teams`, grid);

  // standings bars
  const pts = new Map();
  fr.forEach(x => pts.set(x.d, (pts.get(x.d) || 0) + x.pts));
  const drows = [...pts.entries()].sort((a,b) => b[1] - a[1]).map(([d, v]) => {
    const lt = lastTeam(fr, d) || lastTeam(rows, d);
    return { label: drivers[d].name, value: v, color: teams[lt.t].color, click: "driver:" + d, tip: () => driverTip(d, y) };
  });
  const tpts = new Map();
  fr.forEach(x => tpts.set(x.t, (tpts.get(x.t) || 0) + x.pts));
  const trows = [...tpts.entries()].sort((a,b) => b[1] - a[1]).map(([t, v]) => ({ label: teams[t].name, value: v, color: teams[t].color,
    click: "team:" + t, tip: () => `<div class="tt-row"><i style="background:${teams[t].color}"></i>${esc(teams[t].name)}<b>${fmt(v)} pts</b></div>
      <div class="tt-s">${esc(teams[t].pu ? teams[t].pu + " power" : "")}</div><div class="tt-s" style="margin-top:6px">Click to ${S.team === String(t) ? "clear" : "filter by"} team</div>` }));
  const wins = new Map();
  fr.filter(x => !x.sprint && x.pos === 1).forEach(x => wins.set(x.t, (wins.get(x.t) || 0) + 1));
  const wrows = [...wins.entries()].sort((a,b) => b[1] - a[1]).map(([t, v]) => ({label: teams[t].name, value: v, color: teams[t].color, key: t}));

  // calendar
  const cal = list.map((r, i) => {
    const w = fr.find(x => x.race === r.id && !x.sprint && x.pos === 1);
    const cls = r.status === "Next" ? "status-next" : r.status === "Upcoming" ? "status-up" : "";
    const who = w ? `${helmet(teams[w.t].color, w.num, 20)} <span style="vertical-align:5px">${esc(title(drivers[w.d].last))}</span>` : r.status === "Next" ? "NEXT RACE" : r.status === "Upcoming" ? "—" : "";
    const t = reg(() => `<div class="tt-n">${esc(r.gp)}</div><div class="tt-s">${esc(r.circuit)} · ${dfmt(raceStart(r),{day:"numeric",month:"short",year:"numeric"})}</div>` +
      (w ? `<div class="tt-row" style="margin-top:6px"><i style="background:${teams[w.t].color}"></i>Winner<b>${esc(drivers[w.d].name)}</b></div>` : "") +
      `<div class="tt-s" style="margin-top:6px">Click to open in Race Centre</div>`);
    return `<tr class="row ${cls}" tabindex="0" data-tip="${t}" data-act="race:${r.id}"><td class="num">${r.round}</td><td class="num">${flag(r.gcc)}</td><td class="gpn">${esc(r.gpShort.replace(/ GP$/, ""))}</td>
      <td>${dfmt(raceStart(r),{day:"numeric",month:"short"})}</td><td>${who}</td></tr>`;
  }).join("");

  document.getElementById("main").innerHTML = `<div class="grid">${kpis}
    <section class="card c4"><h2>Drivers' standings<span class="sub">points · bar = team colour</span></h2><div class="chart" id="chDrivers"></div></section>
    <div class="stack c5">
      <section class="card"><h2>Title fight<span class="sub">cumulative points · ${S.team || S.driver ? "selected drivers" : "current top 5"}</span></h2><div class="legend" id="lgFight"></div><div class="chart" id="chFight"></div></section>
      <section class="card"><h2>Constructors' standings</h2><div class="chart" id="chTeams"></div></section>
    </div>
    <div class="stack c3">
      <section class="card"><h2>Wins by team</h2><div class="donutwrap"><div id="chWins"></div><div class="legend">${wrows.map(w => `<span><i class="sq" style="background:${w.color}"></i>${esc(w.label)}<b style="margin-left:auto;color:var(--text)">${w.value}</b></span>`).join("") || ""}</div></div></section>
      <section class="card"><h2>Calendar</h2><div class="scroll" style="max-height:470px"><table class="tbl"><thead><tr><th class="num">Rd</th><th></th><th>Race</th><th>Date</th><th>Winner</th></tr></thead><tbody>${cal}</tbody></table></div></section>
    </div></div>`;

  document.getElementById("chDrivers").innerHTML = drows.length ? barChart("chDrivers", drows, {labW: 138, rowH: 25, aria: "Drivers' standings"}) : `<div class="empty">No points for this selection</div>`;
  document.getElementById("chTeams").innerHTML = trows.length ? barChart("chTeams", trows, {labW: 110, rowH: 24, aria: "Constructors' standings"}) : `<div class="empty">No points</div>`;
  document.getElementById("chWins").innerHTML = donut(wrows, 168);

  // title fight - top 5 at latest standings; colour follows entity (standings order at season end)
  const inFilter = new Set(fr.map(x => x.d));
  const top = (S.team || S.driver ? st.filter(z => inFilter.has(z.d)) : st).slice(0, 5);
  const xs = done.map(r => r.round);
  const cols = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)", "var(--series-5)"];
  const series = top.map((s, i) => {
    const m = new Map();
    dstand.filter(z => z.d === s.d).forEach(z => { const rr = raceById.get(z.race); if (rr.year === y) m.set(rr.round, z.pts); });
    return {name: drivers[s.d].name, color: cols[i], pts: m};
  });
  document.getElementById("lgFight").innerHTML = series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("");
  document.getElementById("chFight").innerHTML = xs.length && series.length ? lineChart("chFight", series, xs, {h: 250, aria: "Cumulative points by round",
    tipTitle: x => { const rr = list.find(r => r.round === x); return `Round ${x} · ${rr.gpShort}`; }}) : `<div class="empty">No data for this selection</div>`;
}

/* ======================================================= PAGE: driver profile */
function pageDriver() {
  const y = S.season, rows = inSeason(y);
  const seasonDrivers = [...new Set(rows.map(x => x.d))].sort((a,b) => drivers[a].last.localeCompare(drivers[b].last));
  const sr = standingsRace(y), st = sr ? standingsAt(sr) : [];
  let d = S.profile != null && seasonDrivers.includes(S.profile) ? S.profile : (st[0] ? st[0].d : seasonDrivers[0]);
  const dr = drivers[d], s = driverSeason(y, d), col = s.team ? s.team.color : "#888";
  const pos = st.find(z => z.d === d);
  const age = Math.floor((Date.now() - utc(dr.dob).getTime()) / 31557600000);
  document.getElementById("title").textContent = `${dr.first.toUpperCase()} ${dr.last}  ·  ${y} SEASON PROFILE`;
  document.getElementById("subtitle").textContent = `Age ${age}  ·  #${s.num ?? "—"}  ·  ${s.team ? s.team.name : ""}  ·  ${dr.nat}`;
  setFilters(seasonSelect() + `<div class="ctl"><label for="fProfile">DRIVER</label><select id="fProfile">${seasonDrivers.map(x => `<option value="${x}" ${x === d ? "selected" : ""}>${esc(drivers[x].name)}</option>`).join("")}</select></div>
     <button class="chipbtn" data-act="back">‹ BACK</button><div class="hint">Click a round in the results table to open that race</div>`);

  const mates = new Map();
  s.gp.forEach(x => x.mate && mates.set(x.mate, (mates.get(x.mate) || 0) + 1));
  const mate = [...mates.entries()].sort((a,b) => b[1] - a[1])[0];
  const list = seasonRaces(y), gpByRound = new Map(s.gp.map(x => [raceById.get(x.race).round, x]));
  const ptsByRound = new Map();
  s.rows.forEach(x => { const rd = raceById.get(x.race).round; ptsByRound.set(rd, (ptsByRound.get(rd) || 0) + x.pts); });
  const roundsRun = list.filter(r => gpByRound.has(r.round));
  const colOf = x => !x || x.pos == null ? "var(--grid-line)" : x.pos === 1 ? "var(--gold)" : x.pos <= 3 ? "var(--accent)" : x.pos <= 10 ? col : "var(--grid-line)";
  const cols = roundsRun.map(r => { const x = gpByRound.get(r.round), v = ptsByRound.get(r.round) || 0;
    return {x: r.round, value: v, color: colOf(x), click: "race:" + r.id, aria: `Round ${r.round} ${r.gpShort} ${v} points`,
      tip: () => `<div class="tt-n">R${r.round} · ${esc(r.gp)}</div><div class="tt-row" style="margin-top:6px"><i style="background:${colOf(x)}"></i>Finished<b>${esc(x.posText)}</b></div>
        <div class="tt-row"><i style="background:var(--grid-line)"></i>Grid<b>${x.grid ?? "PL"}</b></div><div class="tt-row"><i style="background:${col}"></i>Points (GP + sprint)<b>${fmt(v)}</b></div>`}; });

  const kp = [["Championship", pos ? "P" + pos.pos : "—"], ["Points", fmt(s.pts), s.pts], ["Wins", s.wins, s.wins], ["Podiums", s.pod, s.pod],
    ["Poles", s.poles, s.poles], ["Avg finish", s.avgFin ? s.avgFin.toFixed(1) : "—"], ["Avg grid", s.avgGrid ? s.avgGrid.toFixed(1) : "—"], ["DNF / DSQ", s.dnf, s.dnf]];
  const res = roundsRun.map(r => { const x = gpByRound.get(r.round);
    return `<tr class="row" tabindex="0" data-act="race:${r.id}"><td class="num">${r.round}</td><td>${flag(r.gcc)} ${esc(r.gpShort)}</td><td class="num">${x.grid ?? "PL"}</td>
      <td class="num pos" style="color:${x.pos === 1 ? "var(--gold)" : x.pos && x.pos <= 3 ? "var(--accent)" : "inherit"}">${esc(x.posText)}</td><td class="num">${fmt(ptsByRound.get(r.round))}</td></tr>`; }).join("");

  document.getElementById("main").innerHTML = `<div class="grid">
    <section class="card c4"><div class="identity fade"><div class="bigav">${avatar(dr, col, s.num, 132)}</div><div>
      <div class="t2" style="font-size:16px;font-weight:600">${esc(dr.first)}</div><div style="font:800 34px/1.05 var(--display);letter-spacing:.5px">${esc(dr.last)}</div>
      <div class="t2" style="margin-top:8px;font-weight:600">${flag(dr.cc)} ${esc(dr.nat)}</div>
      <div style="margin-top:6px;font-weight:700"><span class="teamchip" style="background:${col}"></span>${esc(s.team ? s.team.name : "")}</div>
      <div class="muted" style="margin-top:6px;font-size:12.5px;font-weight:600">${mate ? "Team-mate: " + esc(mate[0]) : ""}</div></div></div></section>
    <section class="card c8"><h2>${y} season</h2><div class="grid" style="grid-template-columns:repeat(4,1fr);gap:8px">
      ${kp.map(k => `<div class="tile fade"><div class="lbl">${k[0]}</div><div class="big" style="margin-top:6px;${k[0] === "Championship" ? "color:var(--accent)" : ""}" ${k[2] != null ? `data-count="${k[2]}"` : ""}>${k[1]}</div></div>`).join("")}</div></section>
    <div class="stack c6">
      <section class="card"><h2>Points by round<span class="sub">GP + sprint</span></h2>
        <div class="legend"><span><i class="sq" style="background:var(--gold)"></i>Win</span><span><i class="sq" style="background:var(--accent)"></i>Podium</span><span><i class="sq" style="background:${col}"></i>Points finish</span><span><i class="sq" style="background:var(--grid-line)"></i>Outside the points</span></div>
        <div class="chart" id="chPts"></div></section>
      <section class="card"><h2>Grid vs finish<span class="sub">position by round · higher is better</span></h2>
        <div class="legend"><span><i style="background:var(--grid-line)"></i>Grid</span><span><i style="background:var(--accent)"></i>Finish</span></div><div class="chart" id="chGF"></div></section>
    </div>
    <div class="stack c3">
      <section class="card"><h2>Career</h2><div class="grid" style="grid-template-columns:1fr 1fr;gap:12px 10px">
        ${[["Starts", dr.cStarts], ["Wins", dr.cWins], ["Podiums", dr.cPod], ["Poles", dr.cPoles], ["Titles", dr.titles], ["Points", dr.cPts]].map(k => `<div><div class="lbl">${k[0]}</div><div class="big" data-count="${k[1]}">${fmt(k[1])}</div></div>`).join("")}</div></section>
      <section class="card"><h2>Team-mate head-to-head</h2><div class="h2h">
        <div class="tile"><div class="lbl">Race</div><div class="big" style="margin-top:6px">${s.rw + s.rl ? s.rw + " – " + s.rl : "—"}</div></div>
        <div class="tile"><div class="lbl">Qualifying</div><div class="big" style="margin-top:6px">${s.qw + s.ql ? s.qw + " – " + s.ql : "—"}</div></div></div>
        <div class="muted" style="font-size:11.5px;font-weight:600;margin-top:8px">won – lost against team-mate(s) this season</div></section>
    </div>
    <section class="card c3"><h2>Results</h2><div class="scroll" style="max-height:560px"><table class="tbl"><thead><tr><th class="num">Rd</th><th>Grand Prix</th><th class="num">Grid</th><th class="num">Pos</th><th class="num">Pts</th></tr></thead><tbody>${res}</tbody></table></div></section>
  </div>`;
  document.getElementById("chPts").innerHTML = cols.length ? columnChart("chPts", cols, {h: 210, aria: "Points by round"}) : `<div class="empty">No races yet</div>`;
  const g = new Map(), f = new Map();
  roundsRun.forEach(r => { const x = gpByRound.get(r.round); if (x.grid > 0) g.set(r.round, x.grid); if (x.pos) f.set(r.round, x.pos); });
  document.getElementById("chGF").innerHTML = roundsRun.length ? lineChart("chGF", [{name: "Grid", color: "var(--grid-line)", pts: g}, {name: "Finish", color: "var(--accent)", pts: f}],
    roundsRun.map(r => r.round), {h: 210, invert: true, aria: "Grid versus finish by round", tipTitle: x => { const rr = list.find(r => r.round === x); return `Round ${x} · ${rr.gpShort}`; }}) : "";
}

/* ======================================================= render + events */
const PAGES = {race: pageRace, champ: pageChamp, driver: pageDriver};
let lastPage = null;
function render(animate = true) {
  TIPS.length = 0; hideTip();
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("themeBtn").textContent = S.theme === "dark" ? "☀  LIGHT" : "☾  DARK";
  document.getElementById("themeBtn").setAttribute("aria-label", `Switch to ${S.theme === "dark" ? "light" : "dark"} theme`);
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.page === S.page));
  const main = document.getElementById("main");
  main.classList.toggle("static", !animate);
  PAGES[S.page]();
  if (animate && lastPage !== S.page) { main.classList.remove("fade"); void main.offsetWidth; main.classList.add("fade"); }
  lastPage = S.page;
  if (animate) countUp();
  tick();
  const m = D.meta;
  document.getElementById("foot").innerHTML = `Data: <a href="https://github.com/f1db/f1db" target="_blank" rel="noopener">F1DB</a> (CC BY 4.0) · last completed race ${esc(m.last_completed_race)} · circuit outlines: bacinger/f1-circuits (MIT) · unofficial fan dashboard, not affiliated with Formula 1`;
  if (location.hash.slice(1) !== S.page) history.replaceState(null, "", "#" + S.page);
}
function countUp() {
  document.querySelectorAll("[data-count]").forEach(el => {
    const target = +el.dataset.count, text = el.textContent;
    if (!isFinite(target) || target === 0 || !/^[\d,.]+$/.test(text.trim())) return;
    const t0 = performance.now(), dur = 700;
    const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = p < 1 ? Math.round(target * e).toLocaleString("en-US") : text; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function tick() {
  const el = document.getElementById("countdown");
  if (!el) return;
  const ms = +el.dataset.t - Date.now();
  if (ms <= 0) { el.textContent = "Race day"; return; }
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.floor(ms % 36e5 / 6e4), s = Math.floor(ms % 6e4 / 1e3);
  el.textContent = `${d}d ${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`;
}
setInterval(tick, 1000);

const HIST = [];
function go(page, remember = true) {
  if (remember && page !== S.page) HIST.push({page: S.page, raceId: S.raceId, season: S.season, profile: S.profile});
  S.page = page; render(); window.scrollTo({top: 0, behavior: "smooth"});
}
function act(a) {
  if (!a) return;
  const [k, v] = a.split(":");
  if (k === "driver") { S.profile = +v; go("driver"); }
  else if (k === "race") { S.raceId = +v; S.season = raceById.get(+v).year; go("race"); }
  else if (k === "team") { S.team = S.team === v ? "" : v; S.driver = ""; render(); }
  else if (k === "clear") { S.team = ""; S.driver = ""; render(); }
  else if (k === "tz") { S.tz = v; store.set("pw-tz", v); render(false); }
  else if (k === "back") { const p = HIST.pop(); if (p) { Object.assign(S, {raceId: p.raceId, season: p.season, profile: p.profile}); go(p.page, false); } else go("champ", false); }
}
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab"); if (tab) { go(tab.dataset.page); return; }
  const el = e.target.closest("[data-act]"); if (el) act(el.dataset.act);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-act][tabindex]")) { e.preventDefault(); act(e.target.dataset.act); }
});
document.addEventListener("change", e => {
  const id = e.target.id, v = e.target.value;
  if (id === "fSeason") { S.season = +v; S.raceId = null; S.team = ""; S.driver = ""; }
  else if (id === "fRace") S.raceId = v ? +v : null;
  else if (id === "fTeam") S.team = v;
  else if (id === "fDriver") S.driver = v;
  else if (id === "fProfile") S.profile = +v;
  else return;
  render();
});
document.getElementById("themeBtn").addEventListener("click", () => { S.theme = S.theme === "dark" ? "light" : "dark"; store.set("pw-theme", S.theme); render(false); });
window.addEventListener("hashchange", () => { const p = location.hash.slice(1); if (PAGES[p] && p !== S.page) { S.page = p; render(); } });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(false), 150); });
const h0 = location.hash.slice(1); if (PAGES[h0]) S.page = h0;
render();
</script>
</body>
</html>
